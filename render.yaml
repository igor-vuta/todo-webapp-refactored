services:
  # MySQL Database
  - type: pserv
    name: todo-db
    env: docker
    dockerfilePath: ./Dockerfile.mysql
    envVars:
      - key: MYSQL_ALLOW_EMPTY_PASSWORD
        value: "yes"
      - key: MYSQL_DATABASE
        value: todo_app

  # PHP Backend
  - type: web
    name: todo-backend
    env: docker
    dockerfilePath: ./Dockerfile.php
    envVars:
      - key: DB_HOST
        fromService:
          type: pserv
          name: todo-db
          property: host
      - key: DB_NAME
        value: todo_app
      - key: DB_USER
        value: root
      - key: DB_PASS
        value: ""
      - key: JWT_SECRET
        generateValue: true

  # Frontend
  - type: web
    name: todo-frontend
    env: static
    buildCommand: echo "Static files ready"
    staticPublishPath: ./frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
