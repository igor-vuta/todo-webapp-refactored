# Fly.io Configuration
# Deploy: fly launch (generates this), then fly deploy

app = "todo-webapp"
primary_region = "sjc"  # San Jose - change to your preferred region

[build]
  dockerfile = "Dockerfile.php"

[env]
  APP_ENV = "production"
  DB_HOST = "todo-webapp-db.internal"
  DB_PORT = "3306"
  DB_NAME = "todo_app"
  DB_USER = "root"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0  # Scale to zero on free tier

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health.php"

[[services]]
  protocol = "tcp"
  internal_port = 80
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

# MySQL Database as a separate app (fly postgres or external)
# Run: fly postgres create --name todo-webapp-db
